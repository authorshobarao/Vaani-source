kind = "web"
  previewPath = "/"
  title = "My Visit Prep"
  version = "1.0.0"
  id = "artifacts/my-visit-prep"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 19264

  [services.development]
  run = "pnpm --filter @workspace/my-visit-prep run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/my-visit-prep", "run", "build" ]
  publicDir = "artifacts/my-visit-prep/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/privacy"
  to = "/privacy.html"

  [[services.production.rewrites]]
